      tags:
      - sessions
      parameters:
      - &id002
        name: cursor
        in: query
        schema: &id004
          type: string
      - &id003
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      - name: q
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: Optional literal search; omit for normal listing.
      - name: folder_id
        in: query
        schema:
          type: string
          format: uuid
        description: Only chats in this folder; mutually exclusive with unfiled=true.
      - name: unfiled
        in: query
        schema:
          type: boolean
          default: false
        description: Only chats with folder_id=null.
      - name: pinned
        in: query
        schema:
          type: boolean
        description: When supplied filter by this pin state.
      - name: archive
        in: query
        schema:
          type: string
          enum:
          - active
          - archived
          - all
          default: active
        description: Archive scope; all implements Include archived.
      description: Lightweight user chat history, excluding evaluation-generated sessions. Sort last_activity_at
        DESC, id DESC. Search q is a trimmed literal case-insensitive substring over title/public message text;
        one match per session. Cursor is scoped to all filters. See document 14.
