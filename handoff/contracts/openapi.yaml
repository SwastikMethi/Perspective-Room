components:
  schemas:
    PersonaId:
      type: string
      enum:
      - mentor
      - skeptic
      - explorer
      - strategist
      - engineer
      - customer
      - civic
      - health
    Mode:
      type: string
      enum:
      - standard
      - fixed_panel
      - jev_guided
    Error:
      type: object
      properties:
        code: *id004
        message: *id004
        retryable:
          type: boolean
        request_id: *id004
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
      - retryable
      - request_id
      - details
      additionalProperties: false
    Brief:
      type: object
      properties:
        idea: *id004
        goal: &id006
          type:
          - string
          - 'null'
        constraints:
          type: array
          items: *id004
        revision:
          type: integer
          minimum: 1
      required:
      - idea
      - goal
      - constraints
      - revision
      additionalProperties: false
    SessionSettings:
      type: object
      properties:
        research_policy:
          type: string
          enum:
          - auto
          - 'off'
        auto_contributions:
          type: integer
          minimum: 1
          maximum: 3
      required:
      - research_policy
      - auto_contributions
      additionalProperties: false
    SessionCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        idea:
          type: string
          minLength: 1
          maxLength: 16000
        mode:
          $ref: '#/components/schemas/Mode'
        selected_persona_ids:
          type: array
          items:
            $ref: '#/components/schemas/PersonaId'
          minItems: 1
          maxItems: 8
          uniqueItems: true
        settings:
          $ref: '#/components/schemas/SessionSettings'
        folder_id:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - idea
      additionalProperties: false
    Session:
      type: object
      properties:
        id: *id001
        title: *id004
        mode:
          $ref: '#/components/schemas/Mode'
        selected_persona_ids:
          type: array
          items:
            $ref: '#/components/schemas/PersonaId'
        version:
          type: integer
        brief:
          $ref: '#/components/schemas/Brief'
        settings:
          $ref: '#/components/schemas/SessionSettings'
        active_run_id:
          type:
          - string
          - 'null'
          format: uuid
        created_at: &id005
          type: string
          format: date-time
        updated_at: *id005
        organization_version:
          type: integer
          minimum: 1
        folder_id:
          type:
          - string
          - 'null'
          format: uuid
        is_pinned:
          type: boolean
        is_archived:
          type: boolean
        last_activity_at:
          type: string
          format: date-time
        origin_session_id:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - id
      - title
      - mode
      - selected_persona_ids
      - version
      - brief
      - settings
      - active_run_id
      - created_at
      - updated_at
      - organization_version
      - folder_id
      - is_pinned
      - is_archived
      - last_activity_at
