          type: string
          format: uuid
        description: Return an ascending-sequence window containing this same-session message; mutually exclusive
          with cursor. Both next_cursor and previous_cursor navigate the window.
      description: No cursor/anchor returns latest limit messages, in ascending sequence. Cursor encodes before/after
