[project]
name = "perspective-room"
version = "1.1.0"
description = "Perspective Room local brainstorming app (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.83.0",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
pythonpath = [".", "../tests/backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/domain/api.py"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
