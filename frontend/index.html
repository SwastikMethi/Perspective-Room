<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Perspective Room</title>
    <script>
      // Apply the saved theme before first paint (dark by default; no OS inference).
      ;(function () {
        var theme = 'dark'
        try {
          var saved = JSON.parse(localStorage.getItem('perspective-room:ui:v1') || 'null')
          if (saved && saved.state && saved.state.theme === 'light') theme = 'light'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
